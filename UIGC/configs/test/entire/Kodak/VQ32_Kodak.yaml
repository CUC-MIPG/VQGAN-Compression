model:
  target: taming.models.transformer_4step.Transformer_stage1_serial
  params:
    first_stage_key: image
    monitor: val/loss
    ckpt_path: logs/2023-11-14T12-01-52_VQ32_stage1_serial/checkpoints/epoch=000002-v2.ckpt

    transformer_config:
      target: taming.models.transformer_4step.GPT_addtoken
      params:
        vocab_size: 32
        block_size: 328
        n_layer: 32
        n_head: 16
        n_embd: 1152
        extra_token: 5
        
    first_stage_config:
      target: taming.models.vqgan.VQModel
      params:
        ckpt_path: pretrain/kmeans_tune/16384_kmeans_32_epoch/epoch1/checkpoints/last.ckpt
        embed_dim: 256
        n_embed: 32
        ddconfig:
          double_z: false
          z_channels: 256
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 1
          - 2
          - 2
          - 4
          num_res_blocks: 2
          attn_resolutions:
          - 16
          dropout: 0.0
        lossconfig:
          target: taming.modules.losses.DummyLoss

    trainging_config:
      use_simple_optim: true
      init_learning_rate: 1.0e-4
      lr_milestone:
      - 60000
      - 160000
      - 180000
      lr_milestones_gamma: 0.5
      scheduler_interval: step
      mask_ratio: [0.0, 0.75]
      p_mask: 0.95
      val_avg_times: 5
    test_config:
      top_k: 1
      mask_model:
        target: taming.mask_utils.mask_model.Mask_Model_4step
        params:
          mask_type: entire
          down_mask: true
          preserve_margin: false
      quality_model:
        target: taming.quality.Quality_Model
        param: null
data:
  target: taming.data.wrapped_dataset.DataModuleFromConfig
  params:
    batch_size: 8
    num_workers: 4
    train:
      target: taming.data.custom.CustomTrain
      params:
        training_images_list_file: dataset/Kodak.txt
        size: 288
    validation:
      target: taming.data.custom.CustomTest
      params:
        test_images_list_file: dataset/Kodak.txt
        size: 288
    test:
      target: taming.data.custom.CustomTest
      params:
        test_images_list_file: dataset/Kodak.txt #This is the. txt file path that saves all the image paths in the test set
        size: 0 


lightning:
  trainer:
    max_epochs: 3
    val_check_interval: 5000